<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Autosave Form</title>
	<style>
		:root {
			color: #1f2933;
			font-family: Arial, sans-serif;
			background: #f4f6f8;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
		}

		form {
			width: min(90%, 420px);
			padding: 2rem;
			border: 1px solid #d9e2ec;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgb(31 41 51 / 12%);
		}

		h1 {
			margin-top: 0;
		}

		label {
			display: grid;
			gap: 0.4rem;
			margin-top: 1rem;
			font-weight: 600;
		}

		input,
		textarea,
		button {
			box-sizing: border-box;
			padding: 0.65rem;
			border: 1px solid #9fb3c8;
			border-radius: 4px;
			font: inherit;
		}

		input,
		textarea {
			width: 100%;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
		}

		.actions {
			display: flex;
			gap: 0.75rem;
			margin-top: 1.25rem;
		}

		button {
			cursor: pointer;
		}

		.submit-button {
			border-color: #1769aa;
			background: #1769aa;
			color: #ffffff;
		}

		#save-status {
			min-height: 1.5rem;
			color: #1769aa;
		}
	</style>
</head>
<body>
	<form id="contact-form">
		<h1>Contact form</h1>
		<p id="save-status" role="status" aria-live="polite"></p>

		<label for="name">
			Name
			<input id="name" name="name" type="text" autocomplete="name" required>
		</label>

		<label for="email">
			Email
			<input id="email" name="email" type="email" autocomplete="email" required>
		</label>

		<label for="message">
			Message
			<textarea id="message" name="message" required></textarea>
		</label>

		<div class="actions">
			<button class="submit-button" type="submit">Submit</button>
			<button id="clear-button" type="button">Clear saved data</button>
		</div>
	</form>

	<script>
		function autoSaveForm(form, storageKey) {
			const fields = [...form.elements].filter((field) => field.name && field.type !== 'submit' && field.type !== 'button');

			function readForm() {
				return fields.reduce((data, field) => {
					if (field.type === 'checkbox') {
						data[field.name] = field.checked;
					} else if (field.type === 'radio') {
						if (field.checked) data[field.name] = field.value;
					} else {
						data[field.name] = field.value;
					}
					return data;
				}, {});
			}

			function restoreForm() {
				const savedData = localStorage.getItem(storageKey);
				if (!savedData) return false;

				try {
					const data = JSON.parse(savedData);
					fields.forEach((field) => {
						if (!(field.name in data)) return;
						if (field.type === 'checkbox') {
							field.checked = data[field.name];
						} else if (field.type === 'radio') {
							field.checked = field.value === data[field.name];
						} else {
							field.value = data[field.name];
						}
					});
					return true;
				} catch {
					localStorage.removeItem(storageKey);
					return false;
				}
			}

			function saveForm() {
				localStorage.setItem(storageKey, JSON.stringify(readForm()));
			}

			function clearSavedForm() {
				localStorage.removeItem(storageKey);
				form.reset();
			}

			form.addEventListener('input', saveForm);
			restoreForm();

			return { saveForm, clearSavedForm, restoreForm };
		}

		const form = document.getElementById('contact-form');
		const status = document.getElementById('save-status');
		const savedForm = autoSaveForm(form, 'contact-form-draft');

		if (savedForm.restoreForm()) {
			status.textContent = 'Your saved draft was restored.';
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			localStorage.removeItem('contact-form-draft');
			status.textContent = 'Form submitted successfully.';
		});

		document.getElementById('clear-button').addEventListener('click', () => {
			savedForm.clearSavedForm();
			status.textContent = 'Saved data cleared.';
		});
	</script>
</body>
</html>
