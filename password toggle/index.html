<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Toggle</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f4f6f8;
			color: #1f2933;
		}

		form {
			width: min(90%, 360px);
			padding: 2rem;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgb(31 41 51 / 12%);
		}

		h1 {
			margin-top: 0;
			font-size: 1.5rem;
		}

		label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 600;
		}

		.password-row {
			display: flex;
			gap: 0.5rem;
		}

		input,
		button {
			box-sizing: border-box;
			min-height: 2.75rem;
			border: 1px solid #aab4be;
			border-radius: 4px;
			font: inherit;
		}

		input {
			width: 100%;
			padding: 0.6rem;
		}

		button {
			padding: 0.6rem 0.9rem;
			cursor: pointer;
			background: #1769aa;
			color: #ffffff;
		}

		.submit-button {
			width: 100%;
			margin-top: 1rem;
		}

		#message {
			min-height: 1.5rem;
			margin-bottom: 0;
			color: #1769aa;
		}
	</style>
</head>
<body>
	<form id="password-form">
		<h1>Verify your password</h1>

		<label for="password">Password</label>
		<div class="password-row">
			<input id="password" name="password" type="password" required autocomplete="current-password">
			<button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
		</div>

		<button class="submit-button" type="submit">Submit</button>
		<p id="message" role="status" aria-live="polite"></p>
	</form>

	<script>
		const passwordInput = document.getElementById('password');
		const toggleButton = document.getElementById('toggle-password');
		const passwordForm = document.getElementById('password-form');
		const message = document.getElementById('message');

		toggleButton.addEventListener('click', () => {
			const isHidden = passwordInput.type === 'password';
			passwordInput.type = isHidden ? 'text' : 'password';
			toggleButton.textContent = isHidden ? 'Hide' : 'Show';
			toggleButton.setAttribute('aria-pressed', String(isHidden));
		});

		passwordForm.addEventListener('submit', (event) => {
			event.preventDefault();
			message.textContent = 'Password entered successfully.';
		});
	</script>
</body>
</html>
