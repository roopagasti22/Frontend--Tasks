<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynamic Table Rows</title>
	<style>
		:root {
			color: #1f2933;
			font-family: Arial, sans-serif;
			background: #f4f6f8;
		}

		body {
			margin: 0;
			padding: 2rem 1rem;
		}

		main {
			width: min(100%, 900px);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 0.5rem;
		}

		.intro {
			margin-top: 0;
			color: #52606d;
		}

		form,
		.table-wrapper {
			padding: 1.25rem;
			border: 1px solid #d9e2ec;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 6px 18px rgb(31 41 51 / 8%);
		}

		form {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr auto;
			gap: 0.75rem;
			align-items: end;
			margin: 1.5rem 0;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-weight: 600;
		}

		input,
		button {
			box-sizing: border-box;
			min-height: 2.75rem;
			padding: 0.6rem 0.75rem;
			border: 1px solid #9fb3c8;
			border-radius: 4px;
			font: inherit;
		}

		button {
			border-color: #1769aa;
			background: #1769aa;
			color: #ffffff;
			cursor: pointer;
		}

		button:hover {
			background: #0f568c;
		}

		.delete-button {
			border-color: #c0392b;
			background: #c0392b;
		}

		.delete-button:hover {
			background: #962d22;
		}

		.table-wrapper {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}

		th,
		td {
			padding: 0.85rem 0.75rem;
			border-bottom: 1px solid #e4e7eb;
		}

		th {
			background: #f4f6f8;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		#empty-message {
			color: #52606d;
			text-align: center;
		}

		@media (max-width: 700px) {
			form {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main>
		<h1>Team Directory</h1>
		<p class="intro">Add people to the table using the form below.</p>

		<form id="row-form">
			<label for="name">
				Name
				<input id="name" name="name" type="text" required>
			</label>
			<label for="email">
				Email
				<input id="email" name="email" type="email" required>
			</label>
			<label for="role">
				Role
				<input id="role" name="role" type="text" required>
			</label>
			<button type="submit">Add Row</button>
		</form>

		<div class="table-wrapper">
			<table>
				<thead>
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Email</th>
						<th scope="col">Role</th>
						<th scope="col">Action</th>
					</tr>
				</thead>
				<tbody id="table-body">
					<tr id="empty-message">
						<td colspan="4">No rows added yet.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<script>
		const rowForm = document.getElementById('row-form');
		const tableBody = document.getElementById('table-body');
		const emptyMessage = document.getElementById('empty-message');

		rowForm.addEventListener('submit', (event) => {
			event.preventDefault();

			const formData = new FormData(rowForm);
			const row = document.createElement('tr');

			['name', 'email', 'role'].forEach((field) => {
				const cell = document.createElement('td');
				cell.textContent = formData.get(field);
				row.appendChild(cell);
			});

			const actionCell = document.createElement('td');
			const deleteButton = document.createElement('button');
			deleteButton.type = 'button';
			deleteButton.className = 'delete-button';
			deleteButton.textContent = 'Delete';
			deleteButton.addEventListener('click', () => row.remove());
			actionCell.appendChild(deleteButton);
			row.appendChild(actionCell);

			emptyMessage.remove();
			tableBody.appendChild(row);
			rowForm.reset();
			document.getElementById('name').focus();
		});
	</script>
</body>
</html>
